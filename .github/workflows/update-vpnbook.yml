name: Update VPNBook OpenVPN

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------
      # Update credentials
      # ------------------------------------------------------

      - name: Update VPNBook credentials
        run: |
          python scripts/ovpnauth.py

      # ------------------------------------------------------
      # Update OpenVPN profiles
      # ------------------------------------------------------

      - name: Update OpenVPN servers
        run: |
          python scripts/openvpn.py

      # ------------------------------------------------------
      # Validate output
      # ------------------------------------------------------

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          servers_file = Path(
              "output/openvpn/servers.json"
          )

          auth_file = Path(
              "output/auth/openvpn.json"
          )

          if not servers_file.exists():
              raise SystemExit(
                  "servers.json was not created"
              )

          if not auth_file.exists():
              raise SystemExit(
                  "openvpn.json was not created"
              )

          servers = json.loads(
              servers_file.read_text(
                  encoding="utf-8"
              )
          )

          auth = json.loads(
              auth_file.read_text(
                  encoding="utf-8"
              )
          )

          if not servers.get("servers"):
              raise SystemExit(
                  "No VPN servers found"
              )

          if not auth.get("username"):
              raise SystemExit(
                  "VPN username missing"
              )

          if not auth.get("password"):
              raise SystemExit(
                  "VPN password missing"
              )

          print(
              "Servers:",
              len(servers["servers"])
          )

          for server in servers["servers"]:

              print(
                  server["host"],
                  "->",
                  server["ip"],
                  "->",
                  len(server["protocols"]),
                  "protocols"
              )

          print(
              "Credentials:",
              auth["username"]
          )

          print(
              "Validation OK"
          )
          PY

      # ------------------------------------------------------
      # Git status
      # ------------------------------------------------------

      - name: Check changes
        id: changes
        run: |
          git status --short

      # ------------------------------------------------------
      # Commit
      # ------------------------------------------------------

      - name: Commit updated VPN data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m \
              "chore: update VPNBook OpenVPN servers"

            git push
          fi
