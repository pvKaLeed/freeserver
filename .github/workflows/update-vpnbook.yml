name: Update VPN Gate OpenVPN

on:
  schedule:
    - cron: "0 */12 * * *"  # Every 12 hours
  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Update VPN Gate servers
        run: |
          python scripts/vpngate.py
      
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          
          servers_file = Path("output/openvpn/servers.json")
          
          if not servers_file.exists():
              raise SystemExit("servers.json was not created")
          
          servers = json.loads(servers_file.read_text(encoding="utf-8"))
          
          if not servers.get("servers"):
              raise SystemExit("No VPN servers found")
          
          print("Servers:", len(servers["servers"]))
          
          for server in servers["servers"][:5]:
              print(f"  {server['host']} -> {len(server['protocols'])} protocols")
          
          print("Validation OK")
          PY
      
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add output/
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update VPN Gate OpenVPN servers"
            git push
          fi
